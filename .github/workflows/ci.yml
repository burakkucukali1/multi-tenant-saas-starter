# P0-T11 — CI foundation (ADR-0026, ADR-0041).
# ADR-0026 checks not yet in repo (tenant isolation, auth matrix, migration/types, i18n parity) land in P2+.

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier and import sort
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Dependency rule self-tests
        run: pnpm depcruise:validate-rules

      - name: Dependency-cruiser
        run: pnpm depcruise

      - name: Jest (unit)
        run: pnpm test:unit

      - name: Production build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm test:e2e:install

      - name: Playwright smoke
        run: pnpm test:e2e
        env:
          CI: "true"

  integration:
    name: Integration tests (CI Postgres)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    # ADR-0041 §9: serialize all jobs that mutate or depend on the disposable CI Supabase project.
    concurrency:
      group: supabase-ci-project
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Jest (integration)
        run: pnpm test:integration
        env:
          SUPABASE_TEST_DATABASE_URL: ${{ secrets.SUPABASE_TEST_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
